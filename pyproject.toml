[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parallelogram-tx-diagram"
version = "0.1.0"
description = "Rectangular and wave-aligned parallelogram speed diagrams"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "matplotlib>=3.6"]

[project.scripts]
tx-diagram = "parallelogram_tx_diagram.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
